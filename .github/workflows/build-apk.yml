name: Build Android APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install Node Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web App
        run: pnpm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p build-output
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-output/Chemistry_Class12_CBSE_v1.0.0.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/Chemistry_Class12_CBSE_v1.0.0.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Chemistry_Class12_CBSE_v1.0.0.apk
          else
            find android/app/build/outputs/ -name "*.apk" -exec cp {} build-output/Chemistry_Class12_CBSE_v1.0.0.apk \;
          fi
          ls -la build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chemistry-Class12-CBSE-APK
          path: build-output/Chemistry_Class12_CBSE_v1.0.0.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: Chemistry Class 12 CBSE NCERT Mastery v1.0.0
          body: |
            # ⚗️ ChemVault - Class 12 Chemistry CBSE & NCERT Mastery

            ### 🚀 Direct Download Link
            👉 **[Download Chemistry_Class12_CBSE_v1.0.0.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0/Chemistry_Class12_CBSE_v1.0.0.apk)**

            ---

            ### ✨ Key Features in this Release:
            - **100% Offline & Online Ready:** Full curriculum bundled locally, works with zero internet.
            - **Complete 10 CBSE NCERT Chapters:**
              1. Solutions (7 Marks)
              2. Electrochemistry (9 Marks)
              3. Chemical Kinetics (7 Marks)
              4. d- and f-Block Elements (7 Marks)
              5. Coordination Compounds (7 Marks)
              6. Haloalkanes and Haloarenes (6 Marks)
              7. Alcohols, Phenols and Ethers (6 Marks)
              8. Aldehydes, Ketones and Carboxylic Acids (8 Marks)
              9. Amines (6 Marks)
              10. Biomolecules (7 Marks)
            - **Numerical Formulas & Named Reactions Cheat Sheet:** Quick revision cards with SI units and exam pointers.
            - **CBSE Board PYQ Bank (2019 - 2024):** Categorized by marks (1M, 2M, 3M, 5M) with official step-by-step marking schemes.
            - **Interactive Timed Quiz Arena:** Timed mock tests with instant score tracking, question explanations, and celebration effects.
            - **Revision Bookmarks & Global Instant Search:** Bookmark tricky questions and search any chemical equation in milliseconds.
            - **Read-Aloud Audio Voice Reader:** Listen to chapter notes while studying.
          files: build-output/Chemistry_Class12_CBSE_v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
